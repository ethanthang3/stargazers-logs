<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of starred GitHub repositories.">
    <title>Starred repositories | Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Stargazers log</p>
        <h1>Starred repositories</h1>
        <p class="intro">A log of the repositories I've starred on GitHub.</p>
      </header>
      <p id="repository-status" class="status" role="status" aria-live="polite">Loading repositories…</p>
      <ul id="repository-list" class="repository-list" aria-label="Starred repositories"></ul>
    </main>
  </body>
</html>
